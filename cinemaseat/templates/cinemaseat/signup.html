{% load static %}<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up · CinemaSeat</title><link rel="stylesheet" href="{% static 'cinemaseat/style.css' %}"></head><body><nav><a class="brand" href="/login/">◉ <span>Cinema<span>Seat</span></span></a><div class="navright"><a href="{% url 'login' %}">Already a member? <b>Sign in</b></a></div></nav><main class="auth"><div class="auth-card"><p class="eyebrow">JOIN CINEMASEAT</p><h1>Your seat is<br><em>waiting.</em></h1><p class="muted">Create an account to book faster and keep every ticket in one place.</p>{% for message in messages %}<div class="message">{{message}}</div>{% endfor %}<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ request.GET.next }}"><label>Full name<input type="text" name="name" placeholder="Your full name" required></label><label>Email address<input type="email" name="email" placeholder="you@example.com" required></label><label>Password<input type="password" name="password" placeholder="At least 8 characters" required></label><label>Confirm password<input type="password" name="confirm" placeholder="Repeat your password" required></label><label class="check"><input type="checkbox" required> I agree to the Terms and Privacy Policy</label><button class="btn primary full">Create account →</button></form><p class="switch">Already have an account? <a href="{% url 'login' %}">Sign in</a></p></div></main><a class="ai-launcher" href="/ai/" aria-label="Open CinemaSeat AI">✦ AI</a></body></html>
