{% load static %}<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · CinemaSeat</title><link rel="stylesheet" href="{% static 'cinemaseat/style.css' %}"><style>.portal-pills{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 10px}.portal-option{display:flex;align-items:center;gap:8px;padding:12px 14px;border:1px solid #ddd4cc;border-radius:6px;background:#faf7f4;color:#4c4744;font-size:12px;font-weight:700;cursor:pointer}.portal-option input{accent-color:#b9272f}.portal-option.active{border-color:#b9272f;background:#fff2f1}.muted{color:#6d6662}.auth-card .portal-option label{margin:0}.auth-card .portal-option span{display:inline-block}.portal-option input{margin:0}</style></head><body><nav><a class="brand" href="/login/">◉ <span>Cinema<span>Seat</span></span></a><div class="navright"><a class="btn outline" href="{% url 'signup' %}">Create account</a></div></nav><main class="auth"><div class="auth-card"><p class="eyebrow">WELCOME BACK</p><h1>Ready for your<br><em>next story?</em></h1><p class="muted">Choose where you want to enter before signing in.</p>{% for message in messages %}<div class="message">{{message}}</div>{% endfor %}<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ request.GET.next }}"><div class="portal-pills"><label class="portal-option {% if selected_role == 'customer' %}active{% endif %}"><input type="radio" name="role" value="customer" {% if selected_role == 'customer' %}checked{% endif %}><span>Customer</span></label><label class="portal-option {% if selected_role == 'admin' %}active{% endif %}"><input type="radio" name="role" value="admin" {% if selected_role == 'admin' %}checked{% endif %}><span>Admin</span></label></div><label>Email or username<input type="text" name="username" placeholder="you@example.com" required></label><label>Password<input type="password" name="password" placeholder="Your password" required></label><div class="form-row"><label class="check"><input type="checkbox"> Remember me</label><a href="#">Forgot password?</a></div><button class="btn primary full">Sign in →</button></form><p class="switch">Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p></div></main><a class="ai-launcher" href="/ai/" aria-label="Open CinemaSeat AI">✦ AI</a></body></html>
