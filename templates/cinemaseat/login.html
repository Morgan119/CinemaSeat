{% load static %}<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · CinemaSeat</title><link rel="stylesheet" href="{% static 'cinemaseat/style.css' %}"></head><body><nav><a class="brand" href="/login/">◉ <span>Cinema<span>Seat</span></span></a><div class="navright"><a class="btn outline" href="{% url 'signup' %}">Create account</a></div></nav><main class="auth"><div class="auth-card"><p class="eyebrow">WELCOME BACK</p><h1>Ready for your<br><em>next story?</em></h1><p class="muted">Sign in to manage your bookings and discover what's playing.</p>{% for message in messages %}<div class="message">{{message}}</div>{% endfor %}<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ request.GET.next }}"><label>Email or username<input type="text" name="username" placeholder="you@example.com" required></label><label>Password<input type="password" name="password" placeholder="Your password" required></label><div class="form-row"><label class="check"><input type="checkbox"> Remember me</label><a href="#">Forgot password?</a></div><button class="btn primary full">Sign in →</button></form><p class="switch">Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p></div></main><a class="ai-launcher" href="/ai/" aria-label="Open CinemaSeat AI">✦ AI</a></body></html>
